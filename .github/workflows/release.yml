name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0+${GITHUB_SHA::7}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VER" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VER" Resources/Info.plist

      - name: Build universal app (arm64 + x86_64)
        run: UNIVERSAL=1 ./build.sh

      - name: Verify architecture and signature
        run: |
          lipo -info FreeAppStore.app/Contents/MacOS/FreeAppStore
          codesign --verify --deep --strict FreeAppStore.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" FreeAppStore.app/Contents/Info.plist

      - name: Package as zip
        run: ditto -c -k --keepParent FreeAppStore.app FreeAppStore-${{ steps.version.outputs.version }}.zip

      - name: Checksum
        run: shasum -a 256 FreeAppStore-*.zip | tee checksums.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeAppStore-${{ steps.version.outputs.version }}
          path: |
            FreeAppStore-*.zip
            checksums.txt

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            FreeAppStore-*.zip checksums.txt \
            --title "Free App Store $GITHUB_REF_NAME" \
            --generate-notes